name: Integrate tested online-play changes

on:
  push:
    branches: [online-play]
    paths: [.github/online-transfer.json]

permissions:
  contents: write

concurrency:
  group: online-play-transfer
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/online-play'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: arena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arena_test:local-ci-only@127.0.0.1:5432/arena_test
      NODE_ENV: test
      ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and apply text changes without touching other branches
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {gunzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          if(process.env.GITHUB_REF!=='refs/heads/online-play') throw Error('Wrong branch');
          const envelope=JSON.parse(fs.readFileSync('.github/online-transfer.json','utf8'));
          const bytes=gunzipSync(Buffer.from(envelope.payload,'base64'),{maxOutputLength:4000000});
          if(createHash('sha256').update(bytes).digest('hex')!==envelope.sha256) throw Error('Transfer checksum mismatch');
          const bundle=JSON.parse(bytes);
          const roots=['server/','src/online/','tests/online/','docs/online-play/','public/assets/online/'];
          const files=['package.json','package-lock.json','.env.example','.gitignore','Dockerfile','compose.yaml','render.yaml','README.md','src/app/startup.js','src/rendering/world.js','src/physics/simulation.js','src/ui/home-screen.js','src/ui/match-menu.js','src/styles/home.css','tools/serve.mjs','tools/build.mjs','tools/db-migrate.mjs','tools/online-config.mjs','tools/render-online-art.mjs','.github/workflows/online-play.yml','.github/workflows/online-transfer.yml'];
          if(!Array.isArray(bundle.files)||bundle.files.length>200||typeof bundle.message!=='string'||bundle.message.length>160) throw Error('Invalid transfer');
          const seen=new Set();
          for(const file of bundle.files){
            const p=file.path;
            if(typeof p!=='string'||p.includes('..')||p.includes('\\')||path.isAbsolute(p)||seen.has(p)||(!files.includes(p)&&!roots.some(root=>p.startsWith(root)))) throw Error('Disallowed path');
            seen.add(p);
            if(fs.existsSync(p)){
              if(fs.lstatSync(p).isSymbolicLink()) throw Error('Symlink target');
              const old=fs.readFileSync(p);
              const hash=createHash('sha1').update(Buffer.from(`blob ${old.length}\0`)).update(old).digest('hex');
              if(hash!==file.expected) throw Error(`Concurrent change at ${p}`);
            }else if(file.expected!==null) throw Error(`Missing original ${p}`);
          }
          for(const file of bundle.files){
            if(file.content===null){fs.rmSync(file.path,{force:true});continue;}
            if(typeof file.content!=='string'||file.content.includes('\0')) throw Error('Expected UTF-8 text');
            fs.mkdirSync(path.dirname(file.path),{recursive:true});fs.writeFileSync(file.path,file.content);
          }
          fs.mkdirSync('evidence',{recursive:true});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/online-transfer-manifest.json',JSON.stringify({message:bundle.message,paths:bundle.files.map(f=>f.path)}));
          JS
      - name: Install locked dependencies
        run: npm ci
      - name: Verify protected assets and existing bots
        run: |
          npm run verify | tee evidence/verify.log
          npm test | tee evidence/bots.log
      - name: Apply disposable CI database schema
        run: npm run db:migrate
      - name: Online unit, transport and database tests
        run: npm run test:online | tee evidence/online-tests.log
      - name: Build without deploying
        run: npm run build | tee evidence/build.log
        env:
          ROCKET_ARENA_BASE_PATH: /rocket-arena-web
      - name: Independent browser end-to-end tests when present
        run: |
          if [ -f tests/online/browser.mjs ]; then
            npx playwright install --with-deps chromium
            node tests/online/browser.mjs
          fi
      - name: Commit only verified changes to online-play, without force
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const manifest=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/online-transfer-manifest.json','utf8'));
          const git=args=>execFileSync('git',args,{encoding:'utf8'});
          const remote=git(['ls-remote','origin','refs/heads/online-play']).split(/\s/)[0];
          if(remote!==process.env.GITHUB_SHA) throw Error('Branch advanced during testing; refusing to overwrite');
          fs.unlinkSync('.github/online-transfer.json');
          git(['config','user.name','github-actions[bot]']);
          git(['config','user.email','github-actions[bot]@users.noreply.github.com']);
          git(['add','-A','--',...manifest.paths,'.github/online-transfer.json']);
          git(['commit','-m',manifest.message]);
          git(['push','origin','HEAD:refs/heads/online-play']);
          fs.writeFileSync('evidence/commit.txt',git(['rev-parse','HEAD']));
          JS
      - name: Package evidence and workspace
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.github/online-transfer.json -czf "$RUNNER_TEMP/online-workspace.tgz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/online-workspace.tgz
          retention-days: 7
