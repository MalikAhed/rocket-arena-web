name: Online play verification

on:
  push:
    branches: [online-play]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: online-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: arena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONLINE_TEST_DATABASE_URL: postgresql://arena_test:local-ci-only@127.0.0.1:5432/arena_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare evidence
        run: mkdir -p evidence
      - name: Verify protected assets and existing bots
        run: |
          npm run verify | tee evidence/verify.log
          npm test | tee evidence/bots.log
      - name: Multiplayer, failure, security and real PostgreSQL tests
        run: npm run test:online | tee evidence/online-tests.log
      - name: Build Pages-subpath frontend without deploying
        run: npm run build | tee evidence/build.log
        env:
          ROCKET_ARENA_BASE_PATH: /rocket-arena-web
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Independent 1v1, 2v2, 3v3 browsers and offline regression
        run: npm run test:browser | tee evidence/browser.log
      - name: Container build and startup checks
        run: |
          bash tools/container-smoke.sh
      - name: Production dependency audit
        run: npm audit --omit=dev --json > evidence/dependency-audit.json
      - name: Package tracked source and verification evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/online-export"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/online-export"
          if [ -d evidence ]; then cp -R evidence "$RUNNER_TEMP/online-export/evidence"; fi
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/online-export/evidence-commit.txt"
          tar -czf "$RUNNER_TEMP/online-workspace.tgz" -C "$RUNNER_TEMP/online-export" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/online-workspace.tgz
          retention-days: 7
