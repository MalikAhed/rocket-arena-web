name: Online play verification

on:
  push:
    branches: [online-play]

# Temporary branch-only verified source integration; restores read-only CI.
permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: online-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/online-play'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: arena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONLINE_TEST_DATABASE_URL: postgresql://arena_test:local-ci-only@127.0.0.1:5432/arena_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source integration on online-play only
        run: |
          test "$GITHUB_REF" = refs/heads/online-play
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          const allowed=['index.html','src/app/startup.js','src/physics/simulation.js','src/rendering/world.js','src/ui/home-screen.js','src/ui/match-menu.js','tools/build.mjs','tools/serve.mjs'];
          const entries=execFileSync('git',['apply','--numstat','docs/online-play/integration.patch'],{encoding:'utf8'}).trim().split('\n');
          for(const line of entries) if(!allowed.includes(line.split('\t')[2])) throw Error('Unexpected integration path');
          execFileSync('git',['apply','--check','docs/online-play/integration.patch']);
          execFileSync('git',['apply','docs/online-play/integration.patch']);
          const path='server/native.mjs';
          fs.writeFileSync(path,fs.readFileSync(path,'utf8').replace('this.module._physics_destroyArena?.();','this.module._physics_destroy?.();'));
          JS
          node tools/finish-online-integration.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Generate original vector artwork
        run: node tools/render-online-art.mjs
      - name: Prepare evidence directory
        run: mkdir -p evidence
      - name: Verify unchanged protected assets and existing bots
        run: |
          npm run verify | tee evidence/verify.log
          npm test | tee evidence/bots.log
      - name: Online transport, failure, security and real PostgreSQL tests
        run: npm run test:online | tee evidence/online-tests.log
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Render original mode artwork from existing game assets
        run: node tools/render-online-scenes.mjs | tee evidence/artwork.log
      - name: Build without deploying
        run: npm run build | tee evidence/build.log
        env:
          ROCKET_ARENA_BASE_PATH: /rocket-arena-web
      - name: Independent browser end-to-end and offline regression evidence
        run: node tests/online/browser.mjs | tee evidence/browser.log
      - name: Container build and startup smoke tests
        run: |
          docker compose config --quiet
          docker build --target server -t rocket-online-server . > evidence/docker-server.log 2>&1
          docker build --target frontend -t rocket-online-frontend . > evidence/docker-frontend.log 2>&1
          docker run -d --name online-server-check -p 18080:8080 -e NODE_ENV=development rocket-online-server
          docker run -d --name online-frontend-check -p 18081:4173 rocket-online-frontend
          trap 'docker rm -f online-server-check online-frontend-check' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/readyz > evidence/docker-ready.json && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18081/ > /dev/null
          curl -fsS http://127.0.0.1:18081/assets/online/config.json > evidence/docker-frontend-config.json
      - name: Production dependency audit
        run: npm audit --omit=dev --json > evidence/dependency-audit.json
      - name: Commit verified source only to online-play and restore read-only CI
        run: |
          test "$GITHUB_REF" = refs/heads/online-play
          test "$(git ls-remote origin refs/heads/online-play | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let workflow=execFileSync('git',['show','2f3dafe832875ebe22767746d70fa1f0a97a2199:.github/workflows/online-play.yml'],{encoding:'utf8'});
          workflow=workflow.replace('permissions:\n','defaults:\n  run:\n    shell: bash\n\npermissions:\n');
          fs.writeFileSync('.github/workflows/online-play.yml',workflow);
          const files=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/online-edited.json','utf8'));
          execFileSync('git',['add','--',...files]);
          JS
          git rm docs/online-play/integration.patch tools/finish-online-integration.mjs
          git add index.html src/app/startup.js src/physics/simulation.js src/rendering/world.js src/ui/home-screen.js src/ui/match-menu.js tools/build.mjs tools/serve.mjs server/native.mjs public/assets/online .github/workflows/online-play.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate tested multiplayer, failure policies and rendered mode artwork'
          git push origin HEAD:refs/heads/online-play
          git rev-parse HEAD > evidence/commit.txt
      - name: Package exact tested workspace
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env -czf "$RUNNER_TEMP/online-workspace.tgz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/online-workspace.tgz
          retention-days: 7
