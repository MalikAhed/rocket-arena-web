name: Release endpoint audit
on:
  push:
    branches: [online-play]
    paths: [tools/release-probe.mjs, .github/workflows/release-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public endpoints without changing services
        run: node tools/release-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audit-${{ github.run_id }}
          path: evidence/release-probe.json
          retention-days: 7
